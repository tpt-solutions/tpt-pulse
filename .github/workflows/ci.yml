name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Login example
        run: cargo run --example login
      - name: Protocol file check
        run: cargo run -q -p tpt-pulse-cli -- pulse check examples/protocols/login.pulse && cargo run -q -p tpt-pulse-cli -- pulse check examples/protocols/query.pulse
      - name: TLS transport tests
        run: cargo test -p tpt-pulse-backend-tokio --features tls
      - name: Schema tests
        run: cargo test -p tpt-pulse-multiparty --features schema
      - name: Benchmarks compile
        run: cargo bench --workspace --no-run
      - name: API documentation
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: Minimum supported Rust version (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - name: Check all targets
        run: cargo check --workspace --all-targets

  deny:
    name: Dependency policy (cargo deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  wasm:
    name: Bridge tests on wasm32 (Node)
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
    steps:
      - uses: actions/checkout@v4
      # Match rust-toolchain.toml, which rustup uses for cargo, so the target lands on that toolchain.
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown
      # The CLI version must match the wasm-bindgen version in Cargo.lock.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.129
      - uses: Swatinem/rust-cache@v2
      - name: Run the Leptos and Dioxus bridge tests
        run: cargo test -p tpt-pulse-backend-leptos -p tpt-pulse-backend-dioxus --target wasm32-unknown-unknown --test live
