[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.89"
authors = ["TPT Solutions"]
repository = "https://github.com/tpt-solutions/tpt-pulse"
homepage = "https://github.com/tpt-solutions/tpt-pulse"
documentation = "https://docs.rs/tpt-pulse"

[workspace.dependencies]
tpt-pulse-core = { path = "crates/tpt-pulse-core", version = "0.1.0" }
tpt-pulse-ir = { path = "crates/tpt-pulse-ir", version = "0.1.0" }
tpt-pulse-macros = { path = "crates/tpt-pulse-macros", version = "0.1.0" }
tpt-pulse-signals = { path = "crates/tpt-pulse-signals", version = "0.1.0" }
tpt-pulse-multiparty = { path = "crates/tpt-pulse-multiparty", version = "0.1.0" }
tpt-pulse-backend-tokio = { path = "crates/tpt-pulse-backend-tokio", version = "0.1.0" }
tpt-pulse-backend-leptos = { path = "crates/tpt-pulse-backend-leptos", version = "0.1.0" }
tpt-pulse-backend-dioxus = { path = "crates/tpt-pulse-backend-dioxus", version = "0.1.0" }
# tpt-telos from its git repository, pinned to a commit so builds are reproducible.
tpt-telos-ir = { git = "https://github.com/tpt-solutions/tpt-telos", rev = "7d2f62ce66701d068aff6e46d78bde77fa9c6931" }
tpt-telos-verifier = { git = "https://github.com/tpt-solutions/tpt-telos", rev = "7d2f62ce66701d068aff6e46d78bde77fa9c6931" }
proc-macro2 = "1"
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit", "visit-mut"] }
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "sync", "time"] }
leptos = "0.8"
dioxus = { version = "0.7", default-features = false }
dioxus-ssr = "0.7"
trybuild = "1.0"
criterion = "0.5"
schemars = "1"
jsonschema = "0.30"
wasm-bindgen-test = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = "0.13"

[package]
name = "tpt-pulse"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords = ["session-types", "reactive", "multiparty", "protocol", "type-state"]
categories = ["concurrency", "development-tools"]
readme = "README.md"
description = "Session-typed channels and compile-time reactive signals for Rust"
publish = false

[dependencies]
tpt-pulse-core.workspace = true
tpt-pulse-signals.workspace = true
tpt-pulse-multiparty.workspace = true
tpt-pulse-macros.workspace = true

[dev-dependencies]
tpt-pulse-backend-tokio.workspace = true
serde.workspace = true
tokio.workspace = true
tpt-pulse-backend-leptos.workspace = true
leptos = { workspace = true, features = ["ssr"] }
tpt-pulse-backend-dioxus.workspace = true
dioxus = { workspace = true, features = ["macro", "html", "signals", "hooks"] }
dioxus-ssr.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.release]
opt-level = 3

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[workspace.metadata.project]
status = "Pre-release; repository URL follows the tpt-telos organization convention."
