# Policy for `cargo deny check`. Run from the workspace root.

[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
ignore = [
    # `paste` is unmaintained. It is pulled in by leptos, and no safe upgrade exists.
    # Revisit when leptos moves off it.
    { id = "RUSTSEC-2024-0436", reason = "transitive via leptos; no safe upgrade available" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
# Duplicate versions come from the frameworks' own dependencies. Report, do not fail.
multiple-versions = "warn"
# tpt-telos is a git dependency pinned by commit, so it has no version requirement.
# Replace it with a version requirement when tpt-telos is published (see todo.md, Phase 8).
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/tpt-solutions/tpt-telos"]
