[package]
name = "tpt-pulse-signals"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/tpt-pulse-signals"
keywords = ["reactive", "signals", "compile-time", "dataflow", "no-alloc"]
categories = ["rust-patterns", "development-tools"]
readme = "README.md"
description = "Compile-time reactive signals with statically generated, allocation-free propagation"
publish = false

[dependencies]
tpt-pulse-macros.workspace = true

[dev-dependencies]
trybuild.workspace = true
criterion.workspace = true

# The no-allocation test installs a counting global allocator, which needs `unsafe`.
# The workspace forbids it, so this crate denies it instead; the test opts in with #![allow].
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[[bench]]
name = "propagation"
harness = false
