[package]
name = "pulse-backend-tokio"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/pulse-backend-tokio"
keywords.workspace = true
categories.workspace = true
description = "Async session channels over tokio TCP sockets"
publish = false

[dependencies]
pulse-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
rustls = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }

[features]
# TLS over tokio-rustls. Off by default, so the core transports stay free of TLS.
tls = ["dep:rustls", "dep:tokio-rustls"]

[dev-dependencies]
rcgen.workspace = true
serde.workspace = true

[lints]
workspace = true

[[test]]
name = "tls"
required-features = ["tls"]
